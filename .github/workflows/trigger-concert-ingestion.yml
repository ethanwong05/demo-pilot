name: Trigger Concert Ingestion Job

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-ingestion:
    runs-on: ubuntu-latest
    environment: apikey-env        # provides: CONCERT_API_KEY, CONCERT_INSTANCE_ID secrets
    
    steps:
      - name: Trigger Concert Ingestion API
        env:
          CONCERT_API_KEY: ${{ secrets.CONCERT_API_KEY }}
          INSTANCE_ID: ${{ secrets.CONCERT_INSTANCE_ID }}
          CONCERT_URL: ${{ vars.CONCERT_HOSTNAME || 'https://162.133.134.251:12443' }}
          JOB_ID: ${{ vars.INGESTION_JOB_ID || '92073c05-78c1-4f1b-8408-89ed1341a592' }}
        run: |
          echo "Triggering Concert ingestion job..."
          echo "Job ID: ${JOB_ID}"
          
          RESPONSE=$(curl -k --request POST \
            --url ${CONCERT_URL}/ingestion/api/v1/job/v2/submit \
            --header "Authorization: ${CONCERT_API_KEY}" \
            --header "InstanceId: ${INSTANCE_ID}" \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data "{\"job_details\":{\"job_id\":\"${JOB_ID}\",\"job_type\":\"source_control_discovery_job\"}}" \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --silent)
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Concert ingestion job submitted successfully"
            echo "Job ID: ${JOB_ID}"
          else
            echo "❌ Failed to submit Concert ingestion job"
            echo "Status Code: $HTTP_STATUS"
            echo "Response: $BODY"
            exit 1
          fi
      
      - name: Job Summary
        if: always()
        run: |
          echo "## Concert Ingestion Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID**: ${{ vars.INGESTION_JOB_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Type**: source_control_discovery_job" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SBOMs available for Concert Protect ingestion" >> $GITHUB_STEP_SUMMARY
          echo "| App | SBOM file | Key CVEs |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| credit-app | app/credit-app/credit-app-sbom.json | CVE-2017-5638 (Struts 2.3.31, CVSS 10.0) |" >> $GITHUB_STEP_SUMMARY
          echo "| dvja | app/dvja/dvja-sbom.json | CVE-2021-44228 Log4Shell (log4j 2.3), CVE-2017-5638 (Struts 2.3.30), CVE-2022-22965 Spring4Shell (Spring 3.0.5) |" >> $GITHUB_STEP_SUMMARY

